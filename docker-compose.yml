services:
  file-storing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FILE_STORING_DB_NAME}
      POSTGRES_USER: ${FILE_STORING_DB_USER}
      POSTGRES_PASSWORD: ${FILE_STORING_DB_PASSWORD}
    volumes:
      - file-storing-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FILE_STORING_DB_USER} -d ${FILE_STORING_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  file-analysis-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FILE_ANALYSIS_DB_NAME}
      POSTGRES_USER: ${FILE_ANALYSIS_DB_USER}
      POSTGRES_PASSWORD: ${FILE_ANALYSIS_DB_PASSWORD}
    volumes:
      - file-analysis-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FILE_ANALYSIS_DB_USER} -d ${FILE_ANALYSIS_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  file-storing-service:
    restart: unless-stopped
    build:
      context: ./file-storing-service
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: file-storing-service
    ports:
      - "${FILE_STORING_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      minio:
        condition: service_healthy
      file-storing-db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  file-analysis-service:
    restart: unless-stopped
    build:
      context: ./file-analysis-service
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: file-analysis-service
    ports:
      - "${FILE_ANALYSIS_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      file-analysis-db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  api-gateway:
    restart: unless-stopped
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      file-storing-service:
        condition: service_healthy
      file-analysis-service:
        condition: service_healthy
    networks:
      - app-network

volumes:
  minio-data:
  file-storing-data:
  file-analysis-data:

networks:
  app-network:
    driver: bridge