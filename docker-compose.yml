services:
  file-storing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: file_storing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - file-storing-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d file_storing" ]

  file-analysis-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: file_analysis
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - file-analysis-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d file_analysis" ]

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-storing-service:
    build:
      context: ./file-storing-service
      dockerfile: Dockerfile
    container_name: file-storing-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      minio:
        condition: service_healthy
      file-storing-db:
        condition: service_healthy
    networks:
      - app-network

  file-analysis-service:
    build:
      context: ./file-analysis-service
      dockerfile: Dockerfile
    container_name: file-analysis-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      file-analysis-db:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - file-storing-service
      - file-analysis-service
    networks:
      - app-network

volumes:
  minio-data:
  file-storing-data:
  file-analysis-data:

networks:
  app-network:
    driver: bridge