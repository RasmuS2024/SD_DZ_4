server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: file-storing-service
          uri: http://file-storing-service:8081
          predicates:
            - Path=/api/works/**, /h2-console/**
        - id: file-analysis-service
          uri: http://file-analysis-service:8082
          predicates:
            - Path=/api/analysis/**
