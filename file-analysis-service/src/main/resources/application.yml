server:
  port: 8082

spring:
  application:
    name: file-analysis-service

  datasource:
    url: jdbc:h2:mem:analysisdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  file-storing-service:
    url: http://localhost:8081
  file:
    max-size: 1048576
    allowed-formats:
      - pdf
      - docx
      - txt

springdoc:
  api-docs:
    path: /v3/api-docs