server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/file-storage-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  storage:
    type: local
    local:
      upload-dir: ./uploads
